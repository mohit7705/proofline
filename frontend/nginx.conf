server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the browser calls /api/..., nginx forwards it to the backend without the prefix.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite client-supplied forwarding headers before the API trusts them.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 110m;   # matches the 100 MiB video limit plus form overhead
    proxy_request_buffering off; # stream uploads so progress and large files work
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
