[project]
name = "proofline-backend"
version = "0.1.0"
description = "Proofline AI evidence verification backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
    "alembic>=1.13,<1.17",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pillow>=10.4,<12",
    "imagehash>=4.3.2",
    "click>=8.1,<8.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "anyio<4.12",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pluggy==1.6.0",
    "pytest>=8.4,<9",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
